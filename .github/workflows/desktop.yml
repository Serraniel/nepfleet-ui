name: Desktop

# The desktop app's installers build on every platform they ship for, the same
# way the release builds them, without uploading anything.
on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/desktop-installers.yml'
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/desktop-installers.yml'

permissions:
  contents: read

jobs:
  installers:
    # The called job asks for these to upload on releases; with upload off,
    # nothing here writes or signs.
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/desktop-installers.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      upload: false
